
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Once Upon a Time - 27 Years of Michaela</title>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #292929;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
}

#book-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#book {
    margin: auto;
}

.page {
    background: white;
    overflow: hidden;
}

.page img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

</style>
</head>

<body>

<div id="book-container">
    <div id="book"></div>
</div>

<script>

// ======================================
// ΕΙΚΟΝΕΣ ΒΙΒΛΙΟΥ
// ======================================

const images = [
    "images/cover.png",
    "images/1.png",
    "images/2.png",
    "images/3.png",
    "images/4.png",
    "images/5.png",
    "images/6.png",
    "images/7.png",
    "images/8.png",
    "images/9.png",
    "images/10.png",
    "images/11.png",
    "images/12.png",
    "images/13.png",
    "images/14.png",
    "images/end.png"
];

// ======================================
// ΔΗΜΙΟΥΡΓΙΑ ΣΕΛΙΔΩΝ
// ======================================

const bookElement = document.getElementById("book");

images.forEach((src, index) => {

    const page = document.createElement("div");
    page.className = "page";

    const img = document.createElement("img");

    img.src = src;
    img.alt = "Σελίδα " + (index + 1);
    img.draggable = false;

    img.onerror = () => {
        console.error("Δεν βρέθηκε εικόνα:", src);
    };

    page.appendChild(img);
    bookElement.appendChild(page);

});

// ======================================
// ΚΕΝΟ ΟΠΙΣΘΟΦΥΛΛΟ
// ======================================

const backCover = document.createElement("div");
backCover.className = "page";

bookElement.appendChild(backCover);

// ======================================
// ΔΗΜΙΟΥΡΓΙΑ ΒΙΒΛΙΟΥ
// ======================================

const flipBook = new St.PageFlip(bookElement, {

    width: 400,
    height: 560,

    size: "stretch",

    minWidth: 280,
    maxWidth: 500,

    minHeight: 400,
    maxHeight: 700,

    autoSize: true,

    showCover: true,

    flippingTime: 850,

    maxShadowOpacity: 0.6,

    drawShadow: true,

    useMouseEvents: true,

    mobileScrollSupport: false,

    clickEventForward: true,

    showPageCorners: false

});

// ======================================
// ΦΟΡΤΩΣΗ ΒΙΒΛΙΟΥ
// ======================================

flipBook.loadFromHTML(
    document.querySelectorAll(".page")
);

// ======================================
// ΕΝΑ ΠΑΤΗΜΑ ΓΙΑ ΞΕΦΥΛΛΙΣΜΑ
// ======================================

let startX = 0;
let startY = 0;
let moved = false;
let startTime = 0;

bookElement.addEventListener("touchstart", function(e) {

    if (e.touches.length !== 1) return;

    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;

    startTime = Date.now();
    moved = false;

}, { passive: true });

bookElement.addEventListener("touchmove", function(e) {

    if (e.touches.length !== 1) return;

    const dx = Math.abs(e.touches[0].clientX - startX);
    const dy = Math.abs(e.touches[0].clientY - startY);

    if (dx > 12 || dy > 12) {
        moved = true;
    }

}, { passive: true });

bookElement.addEventListener("touchend", function(e) {

    if (moved || Date.now() - startTime > 500) return;

    const rect = bookElement.getBoundingClientRect();

    const x = startX - rect.left;

    if (x > rect.width / 2) {
        flipBook.flipNext();
    } else {
        flipBook.flipPrev();
    }

}, { passive: true });

</script>

</body>
</html>
