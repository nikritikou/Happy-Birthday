
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Το Ψηφιακό μου Βιβλίο</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/page-flip/2.0.7/js/page-flip.browser.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #292929;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#book {
    margin: auto;
}

.controls {
    position: fixed;
    bottom: 20px;
    display: flex;
    gap: 20px;
    align-items: center;
}

button {
    background: #ffffff;
    border: none;
    padding: 12px 22px;
    border-radius: 6px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #dddddd;
}

#page-number {
    color: white;
    font-size: 15px;
}

</style>
</head>

<body>

<div id="book"></div>

<div class="controls">
    <button onclick="flipBook.flipPrev()">❮</button>
    <span id="page-number">1 / 18</span>
    <button onclick="flipBook.flipNext()">❯</button>
</div>

<script>

const images = [
    "cover.png",
    "1.png",
    "2.png",
    "3.png",
    "4.png",
    "5.png",
    "6.png",
    "7.png",
    "8.png",
    "9.png",
    "10.png",
    "11.png",
    "12.png",
    "13.png",
    "14.png",
    "15.png",
    "end.png"
];

const book = document.getElementById("book");

images.forEach((image, index) => {
    const page = document.createElement("div");
    page.className = "page";

    const img = document.createElement("img");
    img.src = image;
    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "contain";

    page.appendChild(img);
    book.appendChild(page);
});

const flipBook = new St.PageFlip(book, {
    width: 400,
    height: 560,
    size: "stretch",
    minWidth: 280,
    maxWidth: 800,
    minHeight: 400,
    maxHeight: 1000,
    maxShadowOpacity: 0.5,
    showCover: true,
    mobileScrollSupport: false
});

flipBook.loadFromHTML(document.querySelectorAll(".page"));

flipBook.on("flip", (e) => {
    document.getElementById("page-number").textContent =
        (e.data + 1) + " / " + images.length;
});

</script>

</body>
</html>
