
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Once Upon a Time - 27 Years of Michaela</title>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    background: #292929;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#book {
    margin: auto;
}

.page {
    background: white;
    overflow: hidden;
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

</style>
</head>

<body>

<div id="book"></div>

<script>

// ΟΙ 16 ΕΙΚΟΝΕΣ ΤΟΥ ΒΙΒΛΙΟΥ

const images = [
    "images/cover.png",
    "images/1.png",
    "images/2.png",
    "images/3.png",
    "images/4.png",
    "images/5.png",
    "images/6.png",
    "images/7.png",
    "images/8.png",
    "images/9.png",
    "images/10.png",
    "images/11.png",
    "images/12.png",
    "images/13.png",
    "images/14.png",
    "images/end.png"
];

// ΔΗΜΙΟΥΡΓΙΑ ΣΕΛΙΔΩΝ

const bookElement = document.getElementById("book");

images.forEach((src) => {

    const page = document.createElement("div");
    page.className = "page";

    const img = document.createElement("img");
    img.src = src;
    img.alt = "Σελίδα βιβλίου";
    img.draggable = false;

    page.appendChild(img);
    bookElement.appendChild(page);

});

// ΔΗΜΙΟΥΡΓΙΑ FLIPBOOK

const flipBook = new St.PageFlip(bookElement, {

    width: 400,
    height: 560,

    size: "stretch",

    minWidth: 280,
    maxWidth: 800,

    minHeight: 400,
    maxHeight: 1000,

    autoSize: true,

    showCover: true,

    maxShadowOpacity: 0.6,

    flippingTime: 1000,

    useMouseEvents: true,

    clickEventForward: true,

    mobileScrollSupport: false

});

// ΦΟΡΤΩΣΗ ΤΩΝ ΣΕΛΙΔΩΝ

flipBook.loadFromHTML(
    document.querySelectorAll(".page")
);

</script>

</body>
</html>
