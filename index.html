
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Michaela's Album</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #eeeeee;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#book {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#spread,
#turnSheet {
  position: absolute;
  top: 50%;
  left: 50%;
  width: var(--book-width, 100%);
  height: var(--book-height, 100%);
  transform: translate(-50%, -50%);
}

#spread {
  display: none;
  flex-direction: row;
}

.page {
  position: relative;
  width: 50%;
  height: 100%;
  flex: 0 0 50%;
  overflow: hidden;
  background: white;
}

.page img,
.sheet-face img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

#turnSheet {
  display: none;
  perspective: 1800px;
  pointer-events: none;
}

#leaf {
  position: absolute;
  top: 0;
  right: 0;
  width: 50%;
  height: 100%;
  transform-origin: left center;
  transform-style: preserve-3d;
}

.sheet-face {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.sheet-back {
  transform: rotateY(180deg);
}

#leaf.turn-forward {
  animation: flipForward 850ms ease-in-out forwards;
}

#leaf.turn-backward {
  animation: flipBackward 850ms ease-in-out forwards;
}

@keyframes flipForward {
  from {
    transform: rotateY(0deg);
  }
  to {
    transform: rotateY(-180deg);
  }
}

@keyframes flipBackward {
  from {
    transform: rotateY(0deg);
  }
  to {
    transform: rotateY(180deg);
  }
}
</style>
</head>

<body>

<div id="book">

  <div id="spread">

    <div class="page">
      <img id="leftPage" alt="">
    </div>

    <div class="page">
      <img id="rightPage" alt="">
    </div>

  </div>

  <div id="turnSheet">

    <div id="leaf">

      <div class="sheet-face sheet-front">
        <img id="frontImage" alt="">
      </div>

      <div class="sheet-face sheet-back">
        <img id="backImage" alt="">
      </div>

    </div>

  </div>

</div>

<script>
const cover = "images/cover.png";
const endCover = "images/end.png";

const pages = [
  "images/1.png",
  "images/2.png",
  "images/3.png",
  "images/4.png",
  "images/5.png",
  "images/6.png",
  "images/7.png",
  "images/8.png",
  "images/9.png",
  "images/10.png",
  "images/11.png",
  "images/12.png",
  "images/13.png",
  "images/14.png"
];

const book = document.getElementById("book");
const spread = document.getElementById("spread");
const sheet = document.getElementById("turnSheet");
const leaf = document.getElementById("leaf");

const leftPage = document.getElementById("leftPage");
const rightPage = document.getElementById("rightPage");

const frontImage = document.getElementById("frontImage");
const backImage = document.getElementById("backImage");

// -1 = εξώφυλλο
// 0 έως 6 = δισέλιδες προβολές
// 7 = οπισθόφυλλο

let current = -1;
let busy = false;
let targetState = null;

// Φορτώνει μόνο την εικόνα που ζητείται.
function loadImage(img, src) {

  if (!src) {
    img.removeAttribute("src");
    return Promise.resolve();
  }

  if (
    img.getAttribute("src") === src &&
    img.complete &&
    img.naturalWidth > 0
  ) {
    return Promise.resolve();
  }

  return new Promise((resolve, reject) => {

    img.onload = () => resolve();

    img.onerror = () => {
      reject(new Error("Δεν φορτώθηκε η εικόνα: " + src));
    };

    img.src = src;

  });
}

// Υπολογισμός μεγέθους με βάση τις πραγματικές
// αναλογίες του εξωφύλλου.
function updateDimensions() {

  const ratio = frontImage.naturalWidth > 0
    ? frontImage.naturalWidth / frontImage.naturalHeight
    : 0.707;

  const pageWidth = Math.min(
    window.innerWidth / 2,
    window.innerHeight * ratio
  );

  const pageHeight = pageWidth / ratio;

  book.style.setProperty(
    "--book-width",
    (pageWidth * 2) + "px"
  );

  book.style.setProperty(
    "--book-height",
    pageHeight + "px"
  );
}

// Εμφάνιση δύο σελίδων.
async function setSpread(index) {

  if (index === -1) {

    spread.style.display = "none";

    leftPage.removeAttribute("src");
    rightPage.removeAttribute("src");

    return;
  }

  let left;
  let right;

  if (index === 7) {

    left = endCover;
    right = null;

  } else {

    left = pages[index * 2];
    right = pages[index * 2 + 1];

  }

  await Promise.all([
    loadImage(leftPage, left),
    loadImage(rightPage, right)
  ]);

  spread.style.display = "flex";
}

// Αρχικό εξώφυλλο.
async function showCover() {

  current = -1;

  await setSpread(-1);

  sheet.style.display = "block";

  leaf.className = "";
  leaf.style.left = "auto";
  leaf.style.right = "0";
  leaf.style.transform = "none";

  await loadImage(frontImage, cover);

  backImage.removeAttribute("src");

  updateDimensions();
}

// Ξεκινά το εφέ γυρίσματος.
async function startFlip(
  direction,
  front,
  back,
  nextState,
  spreadIndex,
  side
) {

  if (busy) return;

  busy = true;
  targetState = nextState;

  try {

    await Promise.all([

      loadImage(frontImage, front),

      loadImage(backImage, back),

      setSpread(spreadIndex)

    ]);

    sheet.style.display = "block";

    leaf.className = "";
    leaf.style.transform = "none";

    if (side === "left") {

      leaf.style.left = "0";
      leaf.style.right = "auto";
      leaf.style.transformOrigin = "right center";

    } else {

      leaf.style.left = "auto";
      leaf.style.right = "0";
      leaf.style.transformOrigin = "left center";

    }

    void leaf.offsetWidth;

    leaf.classList.add(
      direction === "forward"
        ? "turn-forward"
        : "turn-backward"
    );

  } catch (error) {

    console.error(error);

    busy = false;
    sheet.style.display = "none";

  }
}

// Επόμενη σελίδα.
function nextPage() {

  if (busy || current === 7) return;

  if (current === -1) {

    startFlip(
      "forward",
      cover,
      pages[0],
      0,
      0,
      "right"
    );

  } else if (current < 6) {

    startFlip(
      "forward",
      pages[current * 2 + 1],
      pages[(current + 1) * 2],
      current + 1,
      current + 1,
      "right"
    );

  } else {

    startFlip(
      "forward",
      pages[13],
      endCover,
      7,
      7,
      "right"
    );

  }
}

// Προηγούμενη σελίδα.
function previousPage() {

  if (busy || current === -1) return;

  if (current === 0) {

    startFlip(
      "backward",
      pages[0],
      cover,
      -1,
      -1,
      "left"
    );

  } else if (current === 7) {

    startFlip(
      "backward",
      endCover,
      pages[13],
      6,
      6,
      "left"
    );

  } else {

    startFlip(
      "backward",
      pages[current * 2],
      pages[current * 2 - 1],
      current - 1,
      current - 1,
      "left"
    );

  }

}

// Ολοκλήρωση animation.
leaf.addEventListener("animationend", async function(event) {

  if (event.target !== leaf) return;

  current = targetState;

  busy = false;

  sheet.style.display = "none";

  leaf.className = "";
  leaf.style.transform = "none";

  frontImage.removeAttribute("src");
  backImage.removeAttribute("src");

  if (current === -1) {
    await showCover();
  }

});

// Άγγιγμα και σύρσιμο.
let startX = 0;
let startY = 0;

book.addEventListener("pointerdown", function(event) {

  if (busy) return;

  startX = event.clientX;
  startY = event.clientY;

  if (book.setPointerCapture) {
    book.setPointerCapture(event.pointerId);
  }

});

book.addEventListener("pointerup", function(event) {

  if (busy) return;

  const dx = event.clientX - startX;
  const dy = event.clientY - startY;

  if (
    Math.abs(dx) > 30 &&
    Math.abs(dx) > Math.abs(dy)
  ) {

    if (dx < 0) {
      nextPage();
    } else {
      previousPage();
    }

    return;
  }

  if (
    Math.abs(dx) < 15 &&
    Math.abs(dy) < 15
  ) {

    if (current === -1) {
      nextPage();
    } else if (event.clientX > window.innerWidth / 2) {
      nextPage();
    } else {
      previousPage();
    }

  }

});

// Πληκτρολόγιο υπολογιστή.
document.addEventListener("keydown", function(event) {

  if (event.key === "ArrowRight") {
    nextPage();
  }

  if (event.key === "ArrowLeft") {
    previousPage();
  }

});

// Αρχικοποίηση: φορτώνεται μόνο το εξώφυλλο.
loadImage(frontImage, cover).then(() => {

  updateDimensions();

  sheet.style.display = "block";

  leaf.className = "";
  leaf.style.left = "auto";
  leaf.style.right = "0";

  current = -1;

}).catch(error => {

  console.error(error);

});

// Προσαρμογή όταν αλλάζει το μέγεθος της οθόνης.
window.addEventListener("resize", updateDimensions);

</script>

</body>
</html>
