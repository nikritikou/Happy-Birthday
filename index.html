
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Michaela's Album</title>

<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eeeeee;
}

#book {
  margin: auto;
}

.page {
  background: white;
  overflow: hidden;
}

.page img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}
</style>
</head>

<body>

<div id="book">

  <div class="page" data-density="hard">
    <img src="images/cover.png" alt="Cover">
  </div>

  <div class="page">
    <img src="images/1.png" alt="Page 1">
  </div>

  <div class="page">
    <img src="images/2.png" alt="Page 2">
  </div>

  <div class="page">
    <img src="images/3.png" alt="Page 3">
  </div>

  <div class="page">
    <img src="images/4.png" alt="Page 4">
  </div>

  <div class="page">
    <img src="images/5.png" alt="Page 5">
  </div>

  <div class="page">
    <img src="images/6.png" alt="Page 6">
  </div>

  <div class="page">
    <img src="images/7.png" alt="Page 7">
  </div>

  <div class="page">
    <img src="images/8.png" alt="Page 8">
  </div>

  <div class="page">
    <img src="images/9.png" alt="Page 9">
  </div>

  <div class="page">
    <img src="images/10.png" alt="Page 10">
  </div>

  <div class="page">
    <img src="images/11.png" alt="Page 11">
  </div>

  <div class="page">
    <img src="images/12.png" alt="Page 12">
  </div>

  <div class="page">
    <img src="images/13.png" alt="Page 13">
  </div>

  <div class="page">
    <img src="images/14.png" alt="Page 14">
  </div>

  <div class="page" data-density="hard">
    <img src="images/end.png" alt="Back cover">
  </div>

</div>

<script>

const bookElement = document.getElementById("book");

const book = new St.PageFlip(bookElement, {

  width: 420,
  height: 594,

  size: "stretch",

  minWidth: 280,
  maxWidth: 840,

  minHeight: 396,
  maxHeight: 1188,

  showCover: true,

  usePortrait: false,

  flippingTime: 1000,

  maxShadowOpacity: 0.3,

  mobileScrollSupport: true,

  autoSize: true,

  drawShadow: true

});

book.loadFromHTML(
  document.querySelectorAll(".page")
);

</script>

</body>
</html>
