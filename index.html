
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Το Ψηφιακό μου Βιβλίο</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/page-flip/2.0.7/js/page-flip.browser.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #292929;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#book {
    margin: auto;
}

.page {
    background: white;
    overflow: hidden;
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

</style>
</head>

<body>

<div id="book"></div>

<script>

// ΣΕΙΡΑ ΕΙΚΟΝΩΝ

const images = [
    "cover.png",
    "1.png",
    "2.png",
    "3.png",
    "4.png",
    "5.png",
    "6.png",
    "7.png",
    "8.png",
    "9.png",
    "10.png",
    "11.png",
    "12.png",
    "13.png",
    "14.png",
    "15.png",
    "end.png"
];

// ΔΗΜΙΟΥΡΓΙΑ ΣΕΛΙΔΩΝ

const book = document.getElementById("book");

images.forEach(image => {

    const page = document.createElement("div");
    page.className = "page";

    const img = document.createElement("img");
    img.src = image;
    img.alt = "Σελίδα βιβλίου";

    page.appendChild(img);
    book.appendChild(page);

});

// ΔΗΜΙΟΥΡΓΙΑ ΒΙΒΛΙΟΥ

const flipBook = new St.PageFlip(book, {

    width: 400,
    height: 560,

    size: "stretch",

    minWidth: 280,
    maxWidth: 800,

    minHeight: 400,
    maxHeight: 1000,

    maxShadowOpacity: 0.6,

    showCover: true,

    mobileScrollSupport: false,

    flippingTime: 900,

    useMouseEvents: true,

    clickEventForward: true

});

// ΦΟΡΤΩΣΗ ΣΕΛΙΔΩΝ

flipBook.loadFromHTML(
    document.querySelectorAll(".page")
);

// ΚΛΙΚ ΣΤΙΣ ΣΕΛΙΔΕΣ

book.addEventListener("click", function(e) {

    const rect = book.getBoundingClientRect();

    const x = e.clientX - rect.left;

    if (x > rect.width / 2) {

        flipBook.flipNext();

    } else {

        flipBook.flipPrev();

    }

});

</script>

</body>
</html>
