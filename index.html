
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Once Upon a Time - 27 Years of Michaela</title>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #292929;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#book-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#book {
    margin: auto;
}

.page {
    background: white;
    overflow: hidden;
}

.page img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
}

.blank-page {
    background: #292929;
}

</style>
</head>

<body>

<div id="book-container">
    <div id="book"></div>
</div>

<script>

// ==================================
// ΣΕΙΡΑ ΕΙΚΟΝΩΝ
// ==================================

const images = [
    "images/cover.png",
    "images/1.png",
    "images/2.png",
    "images/3.png",
    "images/4.png",
    "images/5.png",
    "images/6.png",
    "images/7.png",
    "images/8.png",
    "images/9.png",
    "images/10.png",
    "images/11.png",
    "images/12.png",
    "images/13.png",
    "images/14.png",
    "images/end.png"
];

const bookElement = document.getElementById("book");

// ==================================
// ΔΗΜΙΟΥΡΓΙΑ ΣΕΛΙΔΩΝ
// ==================================

images.forEach((src, index) => {

    const page = document.createElement("div");
    page.className = "page";

    const img = document.createElement("img");

    img.src = src;
    img.alt = "Σελίδα " + index;
    img.draggable = false;

    img.onerror = function() {
        console.error("Δεν βρέθηκε η εικόνα:", src);
        this.alt = "Δεν βρέθηκε: " + src;
    };

    page.appendChild(img);
    bookElement.appendChild(page);

});

// ==================================
// ΚΕΝΟ ΟΠΙΣΘΟΦΥΛΛΟ
// ==================================

const backCover = document.createElement("div");
backCover.className = "page blank-page";

bookElement.appendChild(backCover);

// ==================================
// ΔΗΜΙΟΥΡΓΙΑ FLIPBOOK
// ==================================

const flipBook = new St.PageFlip(bookElement, {

    width: 400,
    height: 560,

    size: "stretch",

    minWidth: 280,
    maxWidth: 500,

    minHeight: 400,
    maxHeight: 700,

    autoSize: true,

    showCover: true,

    usePortrait: true,

    flippingTime: 1000,

    drawShadow: true,

    maxShadowOpacity: 0.6,

    useMouseEvents: true,

    mobileScrollSupport: false,

    clickEventForward: true,

    showPageCorners: true,

    disableFlipByClick: false

});

// ==================================
// ΦΟΡΤΩΣΗ ΒΙΒΛΙΟΥ
// ==================================

flipBook.loadFromHTML(
    document.querySelectorAll(".page")
);

</script>

</body>
</html>
