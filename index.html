
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Michaela's Album</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #eeeeee;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#book {
  margin: auto;
}

.page {
  background: white;
  overflow: hidden;
}

.page img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}
</style>
</head>

<body>

<div id="book">

  <div class="page">
    <img src="images/cover.png" alt="Cover">
  </div>

  <div class="page">
    <img src="images/1.png" alt="Page 1">
  </div>

  <div class="page">
    <img src="images/2.png" alt="Page 2">
  </div>

  <div class="page">
    <img src="images/3.png" alt="Page 3">
  </div>

  <div class="page">
    <img src="images/4.png" alt="Page 4">
  </div>

  <div class="page">
    <img src="images/5.png" alt="Page 5">
  </div>

  <div class="page">
    <img src="images/6.png" alt="Page 6">
  </div>

  <div class="page">
    <img src="images/7.png" alt="Page 7">
  </div>

  <div class="page">
    <img src="images/8.png" alt="Page 8">
  </div>

  <div class="page">
    <img src="images/9.png" alt="Page 9">
  </div>

  <div class="page">
    <img src="images/10.png" alt="Page 10">
  </div>

  <div class="page">
    <img src="images/11.png" alt="Page 11">
  </div>

  <div class="page">
    <img src="images/12.png" alt="Page 12">
  </div>

  <div class="page">
    <img src="images/13.png" alt="Page 13">
  </div>

  <div class="page">
    <img src="images/14.png" alt="Page 14">
  </div>

  <div class="page">
    <img src="images/end.png" alt="Back cover">
  </div>

</div>

<script>
const bookElement = document.getElementById("book");

function getDimensions() {
  const width = window.innerWidth;
  const height = window.innerHeight;

  // Το βιβλίο έχει δύο σελίδες δίπλα δίπλα.
  const pageWidth = Math.min(
    width / 2,
    height * 0.707
  );

  const pageHeight = Math.min(
    height,
    pageWidth * 1.414
  );

  return {
    width: Math.floor(pageWidth),
    height: Math.floor(pageHeight)
  };
}

function createBook() {
  const dimensions = getDimensions();

  $("#book").turn({
    width: dimensions.width * 2,
    height: dimensions.height,
    display: "double",
    autoCenter: true,
    gradients: true,
    elevation: 50,
    duration: 900,
    acceleration: true,
    pages: 16
  });
}

$(window).on("load", function() {
  createBook();
});

</script>

</body>
</html>
